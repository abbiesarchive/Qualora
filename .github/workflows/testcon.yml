
- name: Test SSH Connection
  uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
  with:
    host: ${{ secrets.SSH_HOST }}
    username: ${{ secrets.SSH_USERNAME }}
    key: ${{ secrets.SSH_KEY }}
    port: 22
    timeout: 60s
    command_timeout: 30s
    debug: true
    script: |
      echo "SSH CONNECTION SUCCESSFUL"
      whoami
      hostname
      pwd
