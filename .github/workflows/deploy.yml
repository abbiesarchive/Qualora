
name: Deploy Laravel to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registration-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and SSH connection
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          : "${SSH_HOST:?Set the SSH_HOST repository secret}"
          : "${SSH_USERNAME:?Set the SSH_USERNAME repository secret}"
          : "${SSH_FINGERPRINT:?Set the SSH_FINGERPRINT repository secret}"

          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            echo "Set SSH_KEY or SSH_PASSWORD as a repository secret." >&2
            exit 1
          fi

      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_sqlite, sqlite3, xml, ctype, iconv, bcmath, filter, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Prepare the test environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction

      - name: Build production assets
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build

      - name: Run tests
        run: |
          php artisan test --compact
        env:
          APP_ENV: testing
          GEMINI_API_KEY: dummy-not-used-in-tests

      - name: Test SSH connection
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          timeout: 30s
          command_timeout: 1m
          debug: true
          script: |
            echo "SSH connection successful!"
            echo "Username:"
            whoami
            echo "Current directory:"
            pwd
            echo "SSH test completed successfully."
